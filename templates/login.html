<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인</title><link rel="stylesheet" href="/static/css/admin.css"><link rel="stylesheet" href="/static/css/admin-density.css">{% if neon_auth %}<link rel="stylesheet" href="/auth/login.css">{% endif %}</head><body class="auth-body"><form class="auth-card" method="post" action="/admin/login"><input type="hidden" name="_csrf" value="{{csrf}}"><div class="auth-symbol">✳</div><span class="upper">CHEONGYANG PLUS HUB</span><h1>관리자 로그인</h1><p>청양플러스 여행사 운영관리 · Neon Auth</p>{% if error %}<div class="auth-error">{{error}}</div>{% endif %}{% if neon_auth %}<div id="neonAuthPanel" class="neon-auth-panel"><p class="neon-hint">운영자 이메일로 Neon Auth 로그인 (권장)</p><label>이메일<input id="neonEmail" type="email" autocomplete="email" placeholder="you@example.com"></label><label>비밀번호<input id="neonPassword" type="password" autocomplete="current-password" minlength="8"></label><button type="button" class="admin-btn" id="neonSignIn">Neon Auth 로그인 →</button><p id="neonMsg" class="neon-msg" role="status"></p></div><hr class="auth-divider"><p class="neon-hint">로컬·백업 계정 (12자 이상 비밀번호)</p>{% endif %}<label>아이디<input name="username" autocomplete="username"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password"></label><button class="admin-btn">관리자 로그인 →</button><a href="/">고객 사이트로 돌아가기</a></form>{% if neon_auth %}<script type="module" src="/auth/admin-login.mjs"></script>{% endif %}</body></html>
