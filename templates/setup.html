<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 최초 설정</title><link rel="stylesheet" href="/static/css/admin.css"></head><body class="auth-body"><form class="auth-card" method="post" action="/setup"><input type="hidden" name="_csrf" value="{{csrf}}"><div class="auth-symbol">✳</div><span class="upper">WELCOME TO CYPLUS</span><h1>최초 관리자 설정</h1><p>관리자가 한 명도 없는 새 설치에서만 열립니다. 안전한 아이디와 12자 이상 비밀번호를 설정하세요.</p><label>관리자 아이디<input name="username" pattern="[A-Za-z0-9_.-]{4,32}" minlength="4" required></label><label>비밀번호<input name="password" type="password" minlength="12" required></label><button class="admin-btn">관리자 계정 만들기</button><a href="/">고객 사이트로 돌아가기</a></form></body></html>
