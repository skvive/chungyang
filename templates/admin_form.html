{% extends 'admin_base.html' %}{% block title %}{{labels[module]}} {{'신규 등록' if new else '수정'}}{% endblock %}{% block content %}<div class="admin-pagehead"><div><span class="upper">EDITOR</span><h1>{{labels[module]}} {{'신규 등록' if new else '수정'}}</h1><p>필수 제목과 내용을 기입한 후 저장하세요.</p></div><a href="/admin/{{module}}" class="admin-btn outline">← 목록으로</a></div><div class="panel form-panel"><form action="/admin/{{module}}/save" method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="id" value="{{item.get('id','')}}"><div class="edit-grid">{% for name,label,type in fields %}<label class="edit-field {{'full' if type=='textarea' else ''}}"><span>{{label}}</span>{% if type=='textarea' %}<textarea name="{{name}}" rows="7" maxlength="12000">{{item.get(name,'')}}</textarea>{% elif type=='category' %}<select name="{{name}}" required>{% for key,cat in categories.items() %}<option value="{{key}}" {{'selected' if item.get(name,'domestic')==key else ''}}>{{cat[0]}}</option>{% endfor %}</select>{% elif type=='lead' %}<select name="{{name}}"><option value="">연결 없음</option>{% if item.get('lead_id') and not lead_options %}<option value="{{item.get('lead_id')}}" selected>연결 상담 #{{item.get('lead_id')}}</option>{% endif %}{% for lead in lead_options %}<option value="{{lead.id}}" {{'selected' if item.get('lead_id')==lead.id else ''}}>#{{lead.id}} {{lead.name}} · {{lead.organization}}</option>{% endfor %}</select>{% elif type=='visibility' %}<select name="{{name}}">{% for key,text in [('published','공개'),('draft','임시저장'),('hidden','숨김')] %}<option value="{{key}}" {{'selected' if item.get(name,'published')==key else ''}}>{{text}}</option>{% endfor %}</select>{% elif type=='proposal_status' %}<select name="{{name}}">{% for key,text in [('draft','초안'),('review','검토'),('sent','발송'),('approved','승인')] %}<option value="{{key}}" {{'selected' if item.get(name,'draft')==key else ''}}>{{text}}</option>{% endfor %}</select>{% elif type=='kind' %}<select name="{{name}}">{% for key,text in [('notice','공지사항'),('story','여행이야기'),('review','여행후기')] %}<option value="{{key}}" {{'selected' if item.get(name,'notice')==key else ''}}>{{text}}</option>{% endfor %}</select>{% elif type=='bool' %}<select name="{{name}}"><option value="1" {{'selected' if item.get(name,0)|string=='1' else ''}}>추천</option><option value="0" {{'selected' if item.get(name,0)|string!='1' else ''}}>일반</option></select>{% else %}<input type="{{type}}" name="{{name}}" value="{{item.get(name,'')}}" maxlength="240" {{'required' if name=='title' else ''}}></input>{% endif %}</label>{% endfor %}</div><div class="form-actions"><button class="admin-btn">저장 및 적용</button><a class="admin-btn outline" href="/admin/{{module}}">취소</a></div></form></div>{% endblock %}
